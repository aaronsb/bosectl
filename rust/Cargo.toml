[package]
name = "bose-bmap"
version = "0.5.0"
edition = "2021"
description = "Control Bluetooth audio devices over the BMAP protocol"
license = "MIT"
readme = "README.md"
rust-version = "1.70"
keywords = ["bose", "bluetooth", "bmap", "headphones", "rfcomm"]
categories = ["hardware-support", "command-line-utilities"]

# Published as bose-bmap (the crates.io name "bmap" belongs to an unrelated
# crate); the library keeps its import name, so code still says `use bmap::`.
[lib]
name = "bmap"
crate-type = ["cdylib", "rlib"]


[dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections"
] }
pollster = "0.3"
serialport = "4.3"



[[bin]]
name = "bmapctl"
path = "src/main.rs"
