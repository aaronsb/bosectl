[project]
name = "pybmap"
version = "0.5.0"
description = "Control Bluetooth audio devices over the BMAP protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.6"
authors = [
    {name = "Aaron Bockelie"},
]
keywords = ["bluetooth", "bmap", "headphones", "audio", "noise-cancellation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
# Linux uses only the standard library; macOS talks to IOBluetooth via PyObjC.
dependencies = [
    "pyobjc-core; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-IOBluetooth; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/aaronsb/bosectl"
Repository = "https://github.com/aaronsb/bosectl"

[project.scripts]
bosectl = "pybmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a paired Bluetooth device",
]
